[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diatonic"
version = "0.1.0"
description = "A local, modular agentic harness: one agent, many apps, voice in and out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.40",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "jsonschema>=4.20",
  "keyring>=25",
  "cronsim>=2.5",
  "pypdf>=4",
]

[project.optional-dependencies]
# Local speech: Whisper (STT) + Piper (TTS). Best on Python 3.12.
voice = ["faster-whisper>=1.0", "piper-tts>=1.3", "numpy>=1.26"]
dev = ["pytest>=8"]

[project.scripts]
diatonic = "diatonic.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["diatonic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
